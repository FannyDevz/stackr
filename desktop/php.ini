; Bundled php.ini for the desktop build. Loaded via PHPRC (set by main.js).
; Static PHP + PHP 8.4 emits E_DEPRECATED from some vendor code (thecodingmachine/safe);
; silence it and never print errors into HTTP responses.
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors = Off
log_errors = On
memory_limit = 256M
date.timezone = UTC
